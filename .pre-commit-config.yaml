default_install_hook_types: [commit-msg, pre-commit]
default_stages: [pre-commit, pre-merge-commit]
minimum_pre_commit_version: 3.2.0
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-vcs-permalinks
      - id: check-yaml
      - id: destroyed-symlinks

  - repo: https://github.com/doublify/pre-commit-rust
    rev: v1.0
    hooks:
      - id: fmt
        name: cargo fmt

  - repo: local
    hooks:
      - id: cargo-clippy
        name: cargo clippy
        description: Run Linter
        entry: cargo clippy --all-features --all-targets
        language: system
        pass_filenames: false

  - repo: local
    hooks:
      - id: cargo-test
        name: cargo test
        description: Run tests
        # The default target is the ESP firmware, which cannot run tests without
        # hardware; the trait-driven logic is tested on the host instead.
        entry: cargo test --lib --target aarch64-apple-darwin
        language: system
        pass_filenames: false

  - repo: https://github.com/qoomon/git-conventional-commits
    rev: v2.6.7
    hooks:
      - id: conventional-commits
