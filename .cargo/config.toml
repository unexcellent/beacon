[build]
target = "riscv32imafc-esp-espidf"

[target.riscv32imafc-esp-espidf]
linker = "ldproxy"
runner = "espflash flash --monitor"
rustflags = [
    "--cfg", "espidf_time64",
]

[unstable]
build-std = ["std", "panic_abort"]

# Portable settings only. esp-idf-sys installs esp-idf + the RISC-V toolchain into
# `.embuild/` (ESP_IDF_TOOLS_INSTALL_DIR = "workspace") on first build, which is what CI relies on.
#
# Machine-specific overrides (reusing a locally-provided toolchain / esp-idf checkout, e.g. on the
# Nix dev box) must NOT live here — committing them makes CI point at paths that only exist on that
# machine. Put them in this machine's global cargo config (~/.cargo/config.toml) instead.
[env]
MCU = "esp32p4"
LIBCSP_BUFFER_SIZE = "600"
ESP_IDF_VERSION = "v5.5.3"
ESP_IDF_TOOLS_INSTALL_DIR = "workspace"
ESP_IDF_GLOB_0_BASE = { value = "cmake_override", relative = true }
ESP_IDF_GLOB_0_GLOB = "main/CMakeLists.txt"
