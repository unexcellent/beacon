[project]
name = "updater"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "transport",
    "move-iiia-wire-types",
    "crc",
    "humanize>=4.15.0",
]

[project.scripts]
update = "update:main"
softboot = "softboot:main"
validate-update = "validate_update:main"

[tool.uv.sources]
transport = { workspace = true }

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["update", "softboot", "validate_update", "packages"]
