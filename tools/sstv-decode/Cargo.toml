[package]
name = "sstv-decode"
version = "0.1.0"
edition = "2021"
publish = false

# Own workspace root so cargo does not fold it into the beacon (ESP) package.
[workspace]

[dependencies]
# Same SSTV codec the firmware encodes with, with host decode helpers enabled.
sstv = { version = "0.1", features = ["image"] }
hound = "3.5"
image = "0.25"
